name: PR Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Windows installer version
        type: string
        default: '0.0.0'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Check changed C and C++ formatting
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...HEAD"
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}...HEAD" -- 'src/*.cpp' 'src/*.h' 'src/*.hpp' 'tests/*.cpp' 'tests/*.h')
          if (( ${#files[@]} )); then
            clang-format-18 --dry-run --Werror "${files[@]}"
          fi

  # Compile and unit-test the native Windows build on every PR. The fork's only
  # native change (the libvirtualhid-dev gamepad backend) is Windows-specific, so
  # this reuses the proven ci-windows.yml definition rather than hand-rolling one.
  # Signing is skipped because publish_release is false and no Azure inputs are passed.
  build-windows:
    name: Windows
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ inputs.release_version || '0.0.0' }}
